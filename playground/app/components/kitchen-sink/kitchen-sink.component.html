<h2>Dark Theme</h2>

<ng-container *ngTemplateOutlet="tiles"></ng-container>


<h2>Light Theme</h2>
<div class="light-box">
  <ng-container *ngTemplateOutlet="tiles; context:{ theme: 'light' }"></ng-container>
</div>


<h2>Status Colors</h2>
<fs-tiles>
  <fs-tile backgroundColor="#43A047">
    <ng-template fsTileLabel>Status</ng-template>
    <ng-template fsTileContent>Active</ng-template>
  </fs-tile>
  <fs-tile backgroundColor="#FB8C00">
    <ng-template fsTileLabel>Status</ng-template>
    <ng-template fsTileContent>Pending</ng-template>
  </fs-tile>
  <fs-tile backgroundColor="#E53935">
    <ng-template fsTileLabel>Status</ng-template>
    <ng-template fsTileContent>Closed</ng-template>
  </fs-tile>
</fs-tiles>


<ng-template #tiles let-theme="theme">

  <fs-tiles [theme]="theme">
    <fs-tile customClass="custom">
      <ng-template fsTileLabel>Status</ng-template>
      <ng-template fsTileContent>Active</ng-template>
    </fs-tile>
    <fs-tile>
      <ng-template fsTileLabel>Duration</ng-template>
      <ng-template fsTileContent>85h</ng-template>
    </fs-tile>
    <fs-tile>
      <ng-template fsTileLabel>Cost</ng-template>
      <ng-template fsTileContent>$4,451</ng-template>
    </fs-tile>
    <fs-tile>
      <ng-template fsTileLabel>Estimate</ng-template>
      <ng-template fsTileContent>10-50h</ng-template>
    </fs-tile>
    <fs-tile>
      <ng-template fsTileLabel>Due Date</ng-template>
      <ng-template fsTileContent>Jan 30</ng-template>
    </fs-tile>
  </fs-tiles>
</ng-template>
